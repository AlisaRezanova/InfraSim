services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infrasim
      POSTGRES_PASSWORD: infrasim
      POSTGRES_DB: infrasim
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infrasim"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://infrasim:infrasim@db:5432/infrasim
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/levels')"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
